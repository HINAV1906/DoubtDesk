services:
  - type: web
    name: doubtdesk
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: doubtdesk-db
          property: connectionString

databases:
  - name: doubtdesk-db
    plan: free
